# Servicio de datos de Mi VistApp detrás de un proxy inverso (ver docs/servidor-datos.md).
# En el servidor vive en ~/mivistapp/ junto a server.cjs; no hace falta el repo.
#
#   echo "PROXY_NETWORK=<red de tu proxy>" > .env
#   docker compose up -d
name: mivistapp

services:
  mivistapp:
    image: node:22-alpine
    restart: unless-stopped
    user: node
    command: node --max-old-space-size=96 /app/server.cjs
    volumes:
      - ./server.cjs:/app/server.cjs:ro
    # Lo lee el CLI de Compose como el usuario que lo lanza, con permisos 600.
    env_file: /etc/mivistapp/vps.env
    environment:
      # Dentro del contenedor tiene que escuchar fuera de 127.0.0.1 para que llegue el proxy.
      HOST: 0.0.0.0
      PORT: 8787
    # Sin puertos publicados: solo lo alcanza el proxy por su red Docker.
    networks:
      - proxy
    read_only: true
    mem_limit: 128m

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
